server:
  port: 48080
  shutdown: graceful

spring:
  application:
    name: ferry-mall-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jackson:
    default-property-inclusion: non_null

ferry:
  security:
    enabled: false
    jwt-secret: ${FERRY_JWT_SECRET:ferry-mall-secret-key-ferry-mall-secret-key}
  feature:
    payment-mock-enabled: true
    coupon-enabled: true
    seckill-enabled: true
    merchant-settlement-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,threaddump
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /doc.html

logging:
  level:
    com.ferry: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] [%thread] %logger{36} - %msg%n"
